name: tmp-gate-proof
on:
  push:
    branches: [ "test/ci-test-suite" ]
permissions:
  contents: read
jobs:
  tests-red:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/tmp-proof-fail.yml
  publish-red:
    needs: tests-red
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.tests-red.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo PUBLISH-RED-RAN
  tests-green:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/tmp-proof-ok.yml
  publish-green:
    needs: tests-green
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.tests-green.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo PUBLISH-GREEN-RAN
